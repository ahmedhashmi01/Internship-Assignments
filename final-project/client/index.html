<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic AI | Resume / Job-Match Analyzer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      // Color/radius/shadow/z values resolve from the semantic CSS custom
      // properties defined in src/index.css (`:root` + `[data-theme="dark"]`),
      // so every Tailwind utility is themeable and dark-mode ready without
      // touching component markup. `primary` is exposed as RGB channels so
      // opacity modifiers (bg-primary/10, ring-primary/20) keep working.
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "rgb(var(--color-primary-rgb) / <alpha-value>)",
              "on-primary": "var(--color-on-primary)",
              "primary-container": "var(--color-primary-container)",
              "secondary": "var(--color-secondary)",
              "secondary-container": "var(--color-secondary-container)",
              "success": "var(--color-success)",
              "warning": "var(--color-warning)",
              "info": "var(--color-info)",
              "error": "var(--color-error)",
              "error-container": "var(--color-error-surface)",
              "on-error": "var(--color-on-error)",
              "on-error-container": "var(--color-on-error-container)",
              "background": "var(--color-background)",
              "surface": "var(--color-surface)",
              "surface-elevated": "var(--color-surface-elevated)",
              "surface-container-lowest": "var(--color-surface-container-lowest)",
              "surface-container-low": "var(--color-surface-container-low)",
              "surface-container": "var(--color-surface-container)",
              "surface-container-high": "var(--color-surface-container-high)",
              "surface-container-highest": "var(--color-surface-container-highest)",
              "on-surface": "var(--color-text-primary)",
              "on-surface-variant": "var(--color-text-secondary)",
              "outline-variant": "var(--color-border)",
              "outline": "var(--color-text-muted)",
              "on-background": "var(--color-text-primary)"
            },
            "borderRadius": {
              "sm": "var(--radius-sm)",
              "md": "var(--radius-md)",
              "lg": "var(--radius-lg)",
              "xl": "var(--radius-xl)"
            },
            "boxShadow": {
              "sm": "var(--shadow-sm)",
              "md": "var(--shadow-md)",
              "lg": "var(--shadow-lg)"
            },
            "zIndex": {
              "sticky": "30",
              "sidebar": "40",
              "header": "50",
              "overlay": "60",
              "modal": "70"
            },
            "spacing": {
              "xs": "var(--space-1)",
              "sm": "var(--space-2)",
              "gutter": "var(--space-3)",
              "md": "var(--space-4)",
              "lg": "var(--space-5)",
              "xl": "var(--space-6)",
              "base": "var(--space-1)",
              "container-max": "1280px"
            },
            "fontFamily": {
              "label-sm": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"],
              "display": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"]
            },
            "fontSize": {
              "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
              "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
              "headline-lg": ["var(--text-headline-lg)", {"lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600"}],
              "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "headline-md": ["var(--text-headline-md)", {"lineHeight": "1.3", "fontWeight": "600"}],
              "display": ["var(--text-display)", {"lineHeight": "1.15", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
